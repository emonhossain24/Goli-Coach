name: GoliCoach checks
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - run: node scripts/prepare-assets.mjs
      - run: python scripts/download_model.py
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r server/requirements.lock
      - run: python scripts/download_model.py
      - run: python scripts/evaluate_cricketvision.py --max-videos 4 --frames-per-video 2 --output cricketvision_inference.json
      - uses: actions/upload-artifact@v4
        with:
          name: cricketvision-inference
          path: cricketvision_inference.json
      - run: python -m pytest tests/test_api.py tests/model_inference_test.py tests/test_bangladesh_evaluation.py tests/test_auth_recovery.py tests/test_maintenance.py tests/test_sharing.py tests/test_smtp_check.py tests/test_split_origin.py tests/test_email_api.py tests/test_storage.py -q
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: coach_test
          POSTGRES_USER: coach_test
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coach_test -d coach_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://coach_test:local-ci-only@localhost:5432/coach_test
      DATABASE_SSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install fastapi==0.115.12 httpx==0.28.1 python-multipart==0.0.20 pytest==8.4.1 'psycopg[binary]==3.2.6'
      - run: python -m pytest tests/test_api.py tests/test_sharing.py tests/test_split_origin.py -q
